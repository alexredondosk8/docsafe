[project]
name = "docsafe"
version = "0.1.0"
description = "Anonimizador local de documentos (PDF, DOCX, XLSX) a Markdown"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "django>=6.1.3",
    "django-environ>=0.14.0",
    "django-q2>=1.11.1",
    "openpyxl>=3.1.5",
    "psutil>=7.2.2",
    "pymupdf4llm>=2.1",
    "python-docx>=1.2.0",
    "whitenoise>=6.12.0",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-django>=4.14.0",
    "ruff>=0.17.3",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["*/migrations/*", "static/vendor"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM", "DJ", "S"]

[tool.ruff.lint.per-file-ignores]
# assert y valores fijos son normales en pruebas.
"tests/**" = ["S101", "S105", "S106"]
"config/settings_test.py" = ["S105"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings_test"
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-ra --strict-markers"
markers = [
    "e2e: pruebas de extremo a extremo (flujo completo)",
]
